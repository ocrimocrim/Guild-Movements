name: Guild Tracker

on:
  schedule:
    - cron: "*/47 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Run the tracker or explicitly replay the lost BUFFER notification"
        type: choice
        options:
          - track
          - replay-buffer
        default: track

permissions:
  contents: write

concurrency:
  group: guild-tracker-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run tracker or replay
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GUILD_TRACKER_GIT_CHECKPOINT: "1"
          TRACKER_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$TRACKER_ACTION" == "replay-buffer" ]]; then
            python tracker.py --replay-buffer
          else
            python tracker.py
          fi
